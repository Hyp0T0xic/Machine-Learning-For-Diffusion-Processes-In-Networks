[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patient-zero"
version = "0.1.0"
description = "Source detection in diffusion cascades — predicting Patient Zero from undirected cascade observations"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "mlflow>=3.12",
    "joblib>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "jupyter>=1.0",
]

[project.scripts]
generate-networks = "scripts.generate_networks:main"
run-simulation    = "scripts.run_simulation:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"
